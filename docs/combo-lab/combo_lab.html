  <style>

    a { color: #F2A33C; } a:hover { color: #FFC97A; }

<style>html, body { margin: 0; background: #0E0C08; color: #F5EFE2; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; }
#lab-app { display: flex; gap: 18px; align-items: flex-start; padding: 12px; min-height: 100vh; box-sizing: border-box; }
#lab-wrap { position: relative; flex: 0 0 auto; }
#lab-stage { position: absolute; left: 0; top: 0; width: 512px; height: 800px; transform-origin: 0 0; }
#lab-host .xroot { box-shadow: 0 0 0 1px rgba(242,163,60,.25), 0 20px 60px rgba(0,0,0,.6); border-radius: 6px; }
.lab-layer { position: absolute; inset: 0; pointer-events: none; }
.lab-canvas { position: absolute; left: 0; top: 0; width: 512px; height: 800px; pointer-events: none; z-index: 40; }
.lab-nums { z-index: 45; }
.lab-slot { position: absolute; box-sizing: border-box; border-radius: 9px; border: 1px dashed rgba(242,163,60,.28); background: rgba(242,163,60,.035); }
.lab-slot.entry { border-color: rgba(242,163,60,.2); background: rgba(242,163,60,.02); }
.lc { position: absolute; left: 0; top: 0; border-radius: 9px; transform-origin: 50% 50%; pointer-events: auto; cursor: pointer; will-change: transform, opacity; box-shadow: 0 3px 7px rgba(0,0,0,.5); touch-action: manipulation; }
.lc img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; border-radius: 9px; }
.lc.sel { box-shadow: 0 0 0 2.5px #F2A33C, 0 0 18px rgba(242,163,60,.6), 0 8px 14px rgba(0,0,0,.55); }
.lc-val { position: absolute; left: 6px; bottom: 5px; padding: 1px 4px; border-radius: 4px; background: rgba(8,6,4,.78); font-size: 9.5px; font-weight: 600; color: #fff; box-shadow: 0 0 0 1px rgba(255,255,255,.25); }
.lc-ord { position: absolute; right: 3px; top: 4px; width: 14px; height: 14px; border-radius: 4px; background: #F2A33C; color: #1A1105; font-size: 8px; font-weight: 600; line-height: 14px; text-align: center; display: none; }
.lc-white { position: absolute; inset: 0; border-radius: 9px; background: radial-gradient(circle at 50% 45%, #FFFFFF 0%, #FFFFFF 55%, rgba(255,255,255,.92) 100%); opacity: 0; pointer-events: none; }
.mono { font-family: 'Martian Mono', ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
.tick { font-family: 'Martian Mono', ui-monospace, monospace; font-size: 7px; letter-spacing: .5px; text-transform: uppercase; color: rgba(245,239,226,.45); }
.lab-float { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; pointer-events: none; will-change: transform, opacity; }
.lab-float.num { font-family: 'Martian Mono', ui-monospace, monospace; font-weight: 600; letter-spacing: -1px;
  text-shadow: 0 2px 0 #0B0906, 0 -1px 0 #0B0906, 1.5px 0 0 #0B0906, -1.5px 0 0 #0B0906, 0 0 10px rgba(0,0,0,.65); }
.lab-float.num.crit { font-weight: 600; text-shadow: 0 2px 0 #0B0906, 0 -1px 0 #0B0906, 1.5px 0 0 #0B0906, -1.5px 0 0 #0B0906, 0 0 14px rgba(255,255,255,.55); }
.lab-float.total { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.lab-float.total b { font-family: 'Martian Mono', monospace; font-weight: 600; font-size: 30px; color: #F5EFE2; letter-spacing: -1.5px;
  text-shadow: 0 2px 0 #0B0906, 0 -1px 0 #0B0906, 2px 0 0 #0B0906, -2px 0 0 #0B0906, 0 0 16px rgba(242,163,60,.55); }
.lab-float.total .tick { color: #F2A33C; text-shadow: 0 1px 3px #000; }
.lab-float.tick-amber, .lab-float.tick-red { font-family: 'Martian Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 1px; padding: 3px 8px; border-radius: 5px; background: rgba(16,13,9,.92); }
.lab-float.tick-amber { color: #F2A33C; box-shadow: inset 0 0 0 1px rgba(242,163,60,.6); }
.lab-float.tick-red { color: #FF6B4A; box-shadow: inset 0 0 0 1px rgba(255,107,74,.6); }
.lab-float.big { font-size: 12px; }
.lab-float.toast { font-family: 'Martian Mono', monospace; font-size: 9.5px; font-weight: 600; letter-spacing: .3px; padding: 7px 14px; border-radius: 7px; background: rgba(16,13,9,.96); }
.lab-float.toast.mint { color: #6FE3B8; box-shadow: inset 0 0 0 1px #6FE3B8, 0 6px 20px rgba(0,0,0,.6); }
.lab-float.toast.red { color: #FF6B4A; box-shadow: inset 0 0 0 1px #FF6B4A, 0 6px 20px rgba(0,0,0,.6); }
@keyframes labfast { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
.lab-float.lead { color: #FFD36A; box-shadow: inset 0 0 0 1px rgba(255,211,106,.8), 0 0 14px rgba(255,211,106,.35); }

/* legibilidade do nome do setor e do round sobre qualquer cenario */
[data-part="visor_sector"], [data-part="visor_round"] {
  background: linear-gradient(180deg, rgba(14,11,7,.86), rgba(8,6,4,.78));
  box-shadow: inset 0 0 0 1px rgba(242,163,60,.38), 0 2px 8px rgba(0,0,0,.55);
  border-radius: 4px; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
}
[data-part="visor_sector"] { padding: 3px 7px; margin: -3px 0 0 -7px; font-size: 8px !important; font-weight: 600; color: #FFB54D !important; text-shadow: 0 1px 0 #000 !important; }
[data-part="visor_round"] { padding: 3px 7px; margin: -3px -7px 0 0; line-height: 1.6 !important; }
[data-part="visor_round"] > div { font-size: 8px !important; font-weight: 600; text-shadow: 0 1px 0 #000 !important; }
[data-part="visor_round"] > div:first-child { color: rgba(245,239,226,.82) !important; }
[data-part="visor_round"] > div:last-child { color: #FFB54D !important; }
[data-part="button_leader"] { pointer-events: auto; position: relative; z-index: 46; }

/* vitoria / derrota */
.lab-end { z-index: 60; }
.end-title, .end-sub, .end-panel { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; pointer-events: none; }
.end-title { font-family: 'Martian Mono', ui-monospace, monospace; font-weight: 700; letter-spacing: -.02em; line-height: 1; display: flex; }
.end-letter { display: inline-block; transform-origin: 50% 80%; will-change: transform, opacity; }
.end-wrap.win .end-letter { color: #FFD36A; text-shadow: 0 3px 0 #0B0906, 0 -1px 0 #0B0906, 2px 0 0 #0B0906, -2px 0 0 #0B0906, 0 0 22px rgba(255,211,106,.6); }
.end-wrap.lose .end-title { color: #FF5A4A; }
.end-sub { font-size: 9px; font-weight: 600; letter-spacing: 1.6px; padding: 4px 10px; border-radius: 5px; background: rgba(10,8,5,.82); }
.end-wrap.win .end-sub { color: #6FE3B8; box-shadow: inset 0 0 0 1px rgba(111,227,184,.55); }
.end-wrap.lose .end-sub { color: #FF6B4A; box-shadow: inset 0 0 0 1px rgba(255,107,74,.55); }
.end-panel { display: flex; flex-direction: column; align-items: center; gap: 14px; transform: translate(-50%, 0); }
.end-stats { display: grid; grid-template-columns: repeat(4, auto); gap: 6px; }
.end-stats > div { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 88px; padding: 8px 6px; border-radius: 7px; background: rgba(22,19,13,.94); box-shadow: inset 0 0 0 1px rgba(242,163,60,.25); }
.end-stats b { font-family: 'Martian Mono', monospace; font-size: 17px; font-weight: 600; color: #F5EFE2; font-variant-numeric: tabular-nums; }
.end-wrap.lose .end-stats b { color: rgba(245,239,226,.72); }
.end-btn { pointer-events: auto; cursor: pointer; border: 0; border-radius: 8px; padding: 11px 26px; font: 700 11px 'Martian Mono', monospace; letter-spacing: 1.2px; }
.end-wrap.win .end-btn { background: #F2A33C; color: #1A1105; box-shadow: 0 6px 22px rgba(242,163,60,.45); }
.end-wrap.lose .end-btn { background: #201C13; color: #FF6B4A; box-shadow: inset 0 0 0 1px #FF6B4A, 0 6px 22px rgba(0,0,0,.6); }
.end-btn:hover { filter: brightness(1.12); }

#lab-panel { flex: 1 1 380px; max-width: 460px; min-width: 300px; background: #16130D; border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(242,163,60,.2); padding: 14px 14px 18px; font-size: 12px; max-height: calc(100vh - 24px); overflow: auto; box-sizing: border-box; }
.pn-title { font-size: 16px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.pn-sec { margin: 14px 0 6px; padding-top: 10px; border-top: 1px dashed rgba(242,163,60,.3); font-weight: 700; font-size: 12px; display: flex; gap: 8px; align-items: baseline; }
.pn-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.pn-row b { color: #F2A33C; font-size: 14px; }
.pn-btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; align-items: center; }
.pn-btns button, .pn-btns select { font: 600 11px 'Instrument Sans', system-ui; color: #F5EFE2; background: #201C13; border: 0; border-radius: 6px; padding: 7px 10px; box-shadow: inset 0 0 0 1px rgba(242,163,60,.3); cursor: pointer; }
.pn-btns button:hover { box-shadow: inset 0 0 0 1px #F2A33C; }
.pn-btns button:disabled { opacity: .4; cursor: default; }
.pn-btns #b-auto { background: #F2A33C; color: #1A1105; box-shadow: none; }
.spd { display: flex; align-items: center; gap: 6px; color: rgba(245,239,226,.6); font-size: 11px; }
.pn-hint { color: rgba(245,239,226,.55); font-size: 11px; line-height: 1.5; margin: 4px 0; }
details { margin: 4px 0; background: #1B1811; border-radius: 6px; padding: 4px 8px; }
summary { cursor: pointer; font-weight: 600; padding: 4px 0; color: #F2A33C; }
.pr { display: grid; grid-template-columns: 1fr 120px 44px; gap: 8px; align-items: center; padding: 3px 0; color: rgba(245,239,226,.75); font-size: 11px; }
.pr input { width: 100%; accent-color: #F2A33C; }
.pr b { text-align: right; color: #F5EFE2; font-size: 10px; }
#lab-json { width: 100%; box-sizing: border-box; background: #0E0C08; color: #F5EFE2; border: 0; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(242,163,60,.2); font-size: 10px; padding: 8px; }
#lab-log { background: #0E0C08; border-radius: 6px; padding: 8px; font-size: 10px; line-height: 1.5; max-height: 220px; overflow: auto; color: rgba(245,239,226,.7); white-space: pre; margin: 0; }
body.snap #lab-panel { display: none; }
body.snap #lab-app { padding: 0; }
@media (max-width: 900px) { #lab-app { flex-direction: column; align-items: center; } #lab-panel { max-width: none; width: 100%; max-height: none; } }
.spd input { accent-color: #F2A33C; }
.tone-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin: 6px 0; }
.tone-card { background: transparent; border: 0; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; border-radius: 6px; }
.tone-card img { width: 100%; aspect-ratio: 76 / 88; border-radius: 5px; display: block; }
.tone-card.on img { box-shadow: 0 0 0 2px #F2A33C, 0 0 10px rgba(242,163,60,.5); }
.tone-card .tick { font-size: 6.5px; }
</style>

  flash(msg, tone) {
    this.setState({ toast: msg, toastOn: true, toastTone: tone || 'amber' });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ toastOn: false }), 1900);
  }

  pick(i) {
    const sel = this.state.sel.slice();
    const at = sel.indexOf(i);
    if (at >= 0) { sel.splice(at, 1); this.setState({ sel }); return; }
    if (sel.length >= 3) return;
    sel.push(i);
    this.setState({ sel });
    if (sel.length === 3) setTimeout(() => this.resolve(), 280);
  }

  tick(enemies) {
    let dmg = 0; const hits = [];
    enemies.forEach((e) => {
      if (!e.alive) return;
      e.atk -= 1;
      if (e.atk <= 0) { dmg += e.dmg; hits.push(e.name); e.atk = e.atkMax; }
    });
    return { dmg, hits };
  }

  resolve() {
    const S = this.state;
    if (S.sel.length !== 3) return;
    const used = S.sel.slice();
    const cs = used.map((i) => S.slots[i]);
    const caps = cs.filter((c) => c.elem === 'capsule').length;
    const sum = cs.reduce((a, c) => a + c.num, 0);

    if (caps > 0 && caps < 3) { this.flash('COMBO INVÁLIDO · CAPSULE NÃO MISTURA', 'red'); this.setState({ sel: [] }); return; }

    const patch = {};
    const enemies = S.enemies.map((e) => ({ ...e }));

    if (caps === 3) {
      const heal = sum * 35;
      patch.teamHp = Math.min(S.teamMax, S.teamHp + heal);
      this.flash('CURA +' + heal, 'mint');
    } else {
      const els = Array.from(new Set(cs.filter((c) => c.elem !== 'wild').map((c) => c.elem)));
      if (els.length > 1) { this.flash('COMBO INVÁLIDO · ELEMENTOS DIFERENTES', 'red'); this.setState({ sel: [] }); return; }
      const el = els[0] || S.allies[0].elem;
      let dmg = sum * 20;
      if (S.leaderOn) dmg = Math.round(dmg * 1.25);

      let t = S.target, rem = dmg;
      while (rem > 0) {
        const e = enemies[t];
        if (e && e.alive) {
          const d = Math.min(e.hp, rem); e.hp -= d; rem -= d;
          if (e.hp <= 0) { e.hp = 0; e.alive = false; }
        }
        if (rem > 0) { const nx = enemies.findIndex((x, j) => j !== t && x.alive); if (nx < 0) break; t = nx; }
        else break;
      }
      patch.leaderOn = false;
      patch.leaderCd = S.leaderOn ? 3 : Math.max(0, S.leaderCd - 1);
      if (!enemies[S.target].alive) { const nx = enemies.findIndex((x) => x.alive); patch.target = nx < 0 ? S.target : nx; }

      const allies = S.allies.map((a) => ({ ...a }));
      const ai = allies.findIndex((a) => a.elem === el);
      if (ai >= 0) allies[ai].skill = Math.min(100, allies[ai].skill + 34);
      patch.allies = allies;

      this.flash('DANO ' + dmg + ' · ' + el.toUpperCase(), 'amber');
    }

    const res = this.tick(enemies);
    const base = (patch.teamHp != null ? patch.teamHp : S.teamHp);
    patch.teamHp = Math.max(0, base - res.dmg);
    patch.enemies = enemies;

    const slots = S.slots.slice();
    let qp = S.qp;
    used.forEach((i) => { slots[i] = this.mk(this.QSEQ[qp % this.QSEQ.length]); qp++; });
    patch.slots = slots; patch.qp = qp; patch.sel = [];

    this.setState(patch, () => {
      if (this.state.enemies.every((e) => !e.alive)) { this.flash('VITÓRIA · SETOR LIMPO', 'mint'); return; }
      if (this.state.teamHp <= 0) { this.flash('DERROTA · EQUIPE CAÍDA', 'red'); return; }
      if (res.hits.length) setTimeout(() => this.flash(res.hits.join(' + ').toUpperCase() + ' ATACOU · -' + res.dmg, 'red'), 950);
    });
  }

  target(i) {
    const S = this.state;
    const e = S.enemies[i];
    if (!e || !e.alive) { this.flash('ALVO ABATIDO', 'red'); return; }
    if (S.target === i && S.popOn) { this.setState({ popOn: false }); return; }
    this.setState({ target: i, popOn: true });
  }

  ally(i) {
    const S = this.state;
    const a = S.allies[i];
    if (a.skill < 100) { this.flash('SKILL ' + a.elem.toUpperCase() + ' ' + a.skill + '%', 'amber'); return; }
    const enemies = S.enemies.map((e) => ({ ...e }));
    const t = enemies[S.target].alive ? S.target : enemies.findIndex((x) => x.alive);
    if (t >= 0) {
      enemies[t].hp = Math.max(0, enemies[t].hp - 600);
      if (enemies[t].hp === 0) enemies[t].alive = false;
    }
    const allies = S.allies.map((x) => ({ ...x }));
    allies[i].skill = 0;
    this.setState({ enemies, allies });
    this.flash('SKILL ' + a.elem.toUpperCase() + ' · -600', 'amber');
  }

    const S = this.state;
    if (S.leaderCd > 0) { this.flash('LIDERANÇA RECARREGA · ' + S.leaderCd, 'red'); return; }

    this.setState({ leaderOn: on });
    this.flash(on ? 'LIDERANÇA ATIVA · +25% NESTE TURNO' : 'LIDERANÇA CANCELADA', 'amber');

        emb: this.CHIP[e.elem].d, cdot: this.CHIP[e.elem].bg,
        badge: badgeOf(e.elem),
        x: p.x + '%', top: (this.px(p.y, this.H) - h) + 'px', hit: (h + PLATE_E) + 'px',
        hitW: Math.round(p.w * .62) + 'px', hitH: Math.round(h * .9) + 'px',
        show: (solo && e.slot !== 'E1') ? 'none' : 'block', showFlex: (solo && e.slot !== 'E1') ? 'none' : 'flex',
        chipTop: (this.px(p.y, this.H) + Math.round(p.w * .34 * .3) + 1) + 'px',
        chipFrame: isT ? 'box-shadow: 0 0 0 1.3px #FF6B4A, 0 0 10px rgba(255,107,74,.55);' : '',
        plateTop: (this.px(p.y, this.H) + 2) + 'px',
        miniTop: (this.px(p.y, this.H) + 3) + 'px', miniW: Math.round(p.w * .5) + 'px',
        tcol: e.alive ? turnOf(e.atk).c : 'rgba(245,239,226,.3)', tanim: e.alive ? turnOf(e.atk).a : 'none',
        s1: e.atk >= 1 ? turnOf(e.atk).s : FAINT, s2: e.atk >= 2 ? turnOf(e.atk).s : FAINT, s3: e.atk >= 3 ? turnOf(e.atk).s : FAINT,
        pct: Math.round(e.hp / e.max * 100) + '%',
        dim: (solo && e.slot !== 'E1') ? '0' : (e.alive ? '1' : '0.35'),
        warn: e.alive && e.atk <= 1,
        frame: isT ? 'box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 0 0 1.4px #FF6B4A, 0 0 12px rgba(255,107,74,.6);' : '',
        pick: () => this.target(i)
      };
    });

    const fila = Array.from({ length: 4 }, (_, k) => {
      const el = this.QSEQ[(S.qp + k) % this.QSEQ.length];
      return { key: 'f' + k, is_dragon: el === 'dragon', is_knight: el === 'knight', is_nature: el === 'nature', is_light: el === 'light', is_dark: el === 'dark', is_capsule: el === 'capsule', is_wild: el === 'wild', op: (1 - k * 0.2).toFixed(2) };
    });

    // alvo + pop-up ancorado acima dele
    const alvo = S.enemies[S.target] || S.enemies[0];
    const ap = this.slotOf(alvo, solo);
    const ah = Math.round(ap.w * 0.97);
    const apxX = this.px(ap.x, this.W);
    const apxTop = this.px(ap.y, this.H) - ah;
    const at = turnOf(alvo.atk);
    const popW = 172;
    const clampX = Math.max(popW / 2 + 6, Math.min(this.W - popW / 2 - 6, apxX));
    const popH = 74;
    const head = apxTop + Math.round(ap.w * .12);
    const above = head - popH - 12 > 26;
    const popLeft = above ? clampX : Math.max(popW / 2 + 6, apxX - Math.round(ap.w * .38) - popW / 2 - 8);
    const popTop = above ? head - popH - 10 : 28;
    const popArrow = above
      ? 'left: 50%; bottom: -5px; transform: translateX(-50%) rotate(45deg); box-shadow: 1px 1px 0 0 rgba(255,107,74,.5);'
      : 'right: -5px; top: 30px; transform: rotate(45deg); box-shadow: 1px -1px 0 0 rgba(255,107,74,.5);';

    const teamRatio = S.teamHp / S.teamMax;
    const teamCol = teamRatio > 0.4 ? '#6FE3B8' : (teamRatio > 0.2 ? '#F2A33C' : '#FF6B4A');
    const tones = { amber: '#F2A33C', red: '#FF6B4A', mint: '#6FE3B8' };

    return {
      cards, enemies, allies, fila, figs,
      showSlots: this.props.showSlots ?? false,
      bgTropical: (this.props.cenario ?? 'tropical') === 'tropical',
      bgDeserto: this.props.cenario === 'deserto',
      bgVetor: this.props.cenario === 'vetor',
      round: S.round, roundMax: S.roundMax,
      aimX: apxX + 'px', aimY: (apxTop + ah / 2) + 'px', aimS: Math.round(ah * 0.96) + 'px',
      popX: popLeft + 'px', popY: popTop + 'px', popArrow, popOn: S.popOn && alvo.alive,
      indAnel: ind === 'anel', indMinimo: ind === 'minimo', indPlaca: ind === 'placa',
      alvoNome: alvo.name, alvoLv: alvo.lv, alvoHp: alvo.hp, alvoMax: alvo.max, alvoAtk: alvo.atk,
      alvoPct: Math.round(alvo.hp / alvo.max * 100) + '%',
      alvoTcol: at.c, alvoTanim: at.a,
      alvoS1: alvo.atk >= 1 ? at.s : FAINT,
      alvoS2: alvo.atk >= 2 ? at.s : FAINT,
      alvoS3: alvo.atk >= 3 ? at.s : FAINT,
      teamHp: S.teamHp, teamMax: S.teamMax, teamCol,
      teamPct: Math.round(teamRatio * 100) + '%',
      crown: () => this.crown(),
      crownTag: S.leaderOn ? 'LÍDER ON' : (S.leaderCd > 0 ? 'CD ' + S.leaderCd : 'LÍDER'),
      crownCol: S.leaderOn ? '#1A1105' : (S.leaderCd > 0 ? 'rgba(245,239,226,.35)' : '#F2A33C'),
      crownFill: S.leaderOn ? '#1A1105' : (S.leaderCd > 0 ? 'rgba(245,239,226,.3)' : '#F2A33C'),
      crownBg: S.leaderOn ? '#F2A33C' : '#201C13',
      crownFrame: S.leaderOn ? '' : 'box-shadow: inset 0 0 0 1px rgba(242,163,60,.3);',
      c1: S.sel.length >= 1 ? '#F2A33C' : FAINT,
      c2: S.sel.length >= 2 ? '#F2A33C' : FAINT,
      c3: S.sel.length >= 3 ? '#F2A33C' : FAINT,
      navEquipe: () => this.nav('EQUIPE'),
      navInvoc: () => this.nav('INVOCAR'),
      navLoja: () => this.nav('LOJA'),
      navFases: () => this.nav('FASES'),
      toast: S.toast, toastOn: S.toastOn, toastCol: tones[S.toastTone] || '#F2A33C'
    };
  }
}
</script>

<script>
(function(){
  const CFG = {};
  const SRC = document.getElementById('src').textContent;
  const CLS = document.getElementById('cls').textContent;
  const IMG = JSON.parse(document.getElementById('imgs').textContent);

  class DCLogic { constructor(p){ this.props = p || {}; } setState(o, cb){ Object.assign(this.state, typeof o === 'function' ? o(this.state) : o); if (cb) cb(); } forceUpdate(){} }
  const Component = new Function('DCLogic', 'setTimeout', 'clearTimeout', CLS + '; return Component;')(DCLogic, function(){ return 0; }, function(){});
  const c = new Component(CFG.props || {});
  if (CFG.state) Object.assign(c.state, CFG.state);
  if (CFG.patch) { for (const [k, v] of Object.entries(CFG.patch)) { const [arr, idx, field] = k.split('.'); c.state[arr][+idx][field] = v; } }
  for (const [fn, ...args] of (CFG.actions || [])) c[fn](...args);
  if (CFG.after) Object.assign(c.state, CFG.after);
  const vals = c.renderVals();

  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function look(path, scopes){
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    const segs = path.split('.');
    let cur;
    for (let i = scopes.length - 1; i >= 0; i--) { if (scopes[i] && Object.prototype.hasOwnProperty.call(scopes[i], segs[0])) { cur = scopes[i][segs[0]]; break; } }
    for (let j = 1; j < segs.length && cur != null; j++) cur = cur[segs[j]];
    return cur;
  }
  function fill(str, scopes){ return str.replace(HOLE, (m, p) => { const v = look(p, scopes); return v == null ? '' : String(v); }); }

  function expand(node, scopes, out){
    if (node.nodeType === 3) { out.push(document.createTextNode(fill(node.nodeValue, scopes))); return; }
    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === 'sc-for') {
      const listExpr = node.getAttribute('list').replace(/[{}]/g, '').trim();
      const list = look(listExpr, scopes) || [];
      const as = node.getAttribute('as');
      list.forEach((item, i) => {
        const produced = [];
        for (const ch of node.childNodes) expand(ch, scopes.concat([{ [as]: item, $index: i }]), produced);
        for (const p of produced) { if (p.nodeType === 1) { p.setAttribute('data-loop', listExpr); p.setAttribute('data-i', i); } out.push(p); }
      });
      return;
    }
    if (tag === 'sc-if') {
      const v = look(node.getAttribute('value').replace(/[{}]/g, ''), scopes);
      if (v) for (const ch of node.childNodes) expand(ch, scopes, out);
      return;
    }
    const el = node.namespaceURI === 'http://www.w3.org/2000/svg'
      ? document.createElementNS(node.namespaceURI, node.localName)
      : document.createElement(node.localName);
    for (const at of node.attributes) {
      if (/^on/i.test(at.name) || at.name.startsWith('hint-')) continue;
      let v = fill(at.value, scopes);
      if (at.name === 'src' && IMG[v]) v = IMG[v];
      el.setAttribute(at.name, v);
    }
    for (const ch of node.childNodes) expand(ch, scopes, el.childNodes.length >= 0 ? { push: (n) => el.appendChild(n) } : null);
    out.push(el);
  }

  const doc = new DOMParser().parseFromString('<body>' + SRC + '</body>', 'text/html');
  const host = document.getElementById('host');
  const produced = [];
  for (const ch of doc.body.childNodes) expand(ch, [vals], produced);
  for (const p of produced) host.appendChild(p);

  // ---------------- nomes das pecas ----------------
  const R = [...host.children].find((e) => e.localName === 'div');
  R.classList.add('xroot');
  const tag = (el, name) => { if (el) el.setAttribute('data-part', name); return el; };
  const kids = [...R.children];
  const [defs, header, strip, visor, team, bank, nav] = kids;
  const toast = kids[7];
  tag(header, 'header');
  const av = tag(header.children[0], 'header_avatar'); tag(av.children[0], 'header_avatar_img');
  tag(av.children[1], 'header_avatar_frame'); tag(av.children[2], 'header_avatar_corner_tl'); tag(av.children[3], 'header_avatar_corner_br');
  const pl = tag(header.children[1], 'header_player');
  tag(pl.children[0].children[0], 'header_player_name'); tag(pl.children[0].children[1], 'header_player_rank');
  const xpRow = pl.children[1];
  const xp = tag(xpRow.children[0], 'header_xp_bar'); tag(xp.children[0], 'header_xp_fill'); tag(xp.children[1], 'header_xp_segments');
  tag(xpRow.children[1], 'header_xp_text');
  const sy = tag(header.children[2], 'header_sync');
  tag(sy.children[0], 'header_sync_dot'); tag(sy.children[1], 'header_sync_text'); tag(sy.children[2], 'icon_menu');

  tag(strip, 'strip');
  ['bits', 'rule_1', 'gems', 'rule_2', 'energy'].forEach((n, i) => {
    const cell = tag(strip.children[i], 'strip_' + n);
    if (!n.startsWith('rule')) { tag(cell.children[0].children[0], 'icon_' + n); tag(cell.children[0].children[1], 'strip_' + n + '_label'); tag(cell.children[1], 'strip_' + n + '_value'); }
    if (n === 'energy') tag(cell.children[0].children[2], 'strip_energy_timer');
  });

  tag(visor, 'visor');
  const corners = { 'left: 8px; top: 8px': 'tl', 'right: 8px; top: 8px': 'tr', 'left: 8px; bottom: 8px': 'bl', 'right: 8px; bottom: 8px': 'br' };
  for (const el of [...visor.children]) {
    const st = el.getAttribute('style') || '';
    if (el.localName === 'img') tag(el, 'visor_bg');
    else if (el.getAttribute('data-loop') === 'figs') {
      const id = vals.figs[+el.getAttribute('data-i')].id;
      tag(el, 'stage_fig_' + id);
      const svg = el.querySelector('svg'); if (svg) tag(svg, 'stage_ring_' + id);
      const img = el.querySelector('img'); if (img) tag(img, 'stage_sprite_' + id);
    }
    else if (st.includes('rgba(0,0,0,.15) 0 1px')) tag(el, 'visor_film_scanline');
    else if (st.includes('radial-gradient(115%')) tag(el, 'visor_film_vignette');
    else if (st.includes('animation: ret')) tag(el, 'visor_aim');
    else if (el.classList.contains('chip')) {
      const loop = el.getAttribute('data-loop'); const i = +el.getAttribute('data-i');
      const key = (loop === 'enemies' ? vals.enemies : vals.allies)[i].key;

  function drawLeaderAura(t) {

  function orb(start, dur, from, to, col, arc, size, trail) {

      const center = figPoint(tSlot, .5);
      const hits = [];
      if (P.perColor) ev.contribuicoes.forEach((k) => hits.push({ cor: k.cor, valor: k.valor, cura: k.cura, critico: false }));
      else ev.combos.forEach((k) => {
        if (k.parciais) Object.keys(k.parciais).forEach((cc) => hits.push({ cor: +cc, valor: k.parciais[cc], critico: k.critico }));
        else hits.push({ cor: k.cor, valor: k.dano_parcial ?? k.cura, cura: k.cor === 5, critico: k.critico });
      });
      const r = rnd();
      let t = c, lastImpact = c;
      const sprite = spriteEl(tSlot);
      hits.forEach((h, i) => {
        const col = colorOf(h.cor);
        if (h.cura) {
          const tb = rel(part('team_hp_text'));
          floatText(t, P.numLifeMs, tb.x + tb.w / 2, tb.y - 4, `+${h.valor}`, 'num', (el, p, x, y) => numAnim(el, p, x, y, 0, col, false));
          t += P.strikeStaggerMs * .6; return;
        }
        const from = figPoint(SLOT_OF_COR[h.cor], .5);
        streak(t, P.strikeMs, from, center, col);
        hop(SLOT_OF_COR[h.cor], t, P.hopPx * .7, 220);
        ringTween(SLOT_OF_COR[h.cor], t, 260, ALLY_BASE[SLOT_OF_COR[h.cor]], 0);
        { const sl = SLOT_OF_COR[h.cor]; at(t, 1, { begin() { delete AURA[sl]; } }); burst(t, from.x, from.y, col, 10, 30, 140, 300, 2, -60); }
        const imp = t + P.strikeMs; lastImpact = imp;
        burst(imp, center.x, center.y, col, 16, 40, 200, 360, 2.2, 40);
        at(imp, 90, { update(p) { sprite.style.filter = `brightness(${1 + 1.2 * (1 - p)})`; }, end() { sprite.style.filter = ''; } });
        shakeEl(sprite, imp, 170, P.hitShakePx);
        const ang = r() * Math.PI * 2, rad = Math.sqrt(r());
        const VR = rel(part('visor'));
        const nx = clamp(center.x + Math.cos(ang) * P.numRx * rad, VR.x + 24, VR.x + VR.w - 24), ny = clamp(center.y - 10 + Math.sin(ang) * P.numRy * rad, VR.y + 40, VR.y + VR.h - 20);
        const drift = (r() - .5) * 2 * P.numDrift, rise = P.numRise * lerp(.8, 1.8, r());
        floatText(imp, P.numLifeMs, nx, ny, `${h.valor}${h.critico ? '!' : ''}`, 'num' + (h.critico ? ' crit' : ''), (el, p, x, y) => numAnim(el, p, x, y, 1, col, h.critico, drift, rise, center));
        t += P.strikeStaggerMs;
      });
      ev.golpes.forEach((g) => { const e = logic.inimigos[g.inimigo]; ringTween(ENEMY_SLOTS[g.inimigo], lastImpact, 420, Math.round(g.hp / e.max * 100)); });
      if (ev.dano_total > 0 && P.showTotal) {
        floatText(lastImpact + 180, 1300, clamp(center.x, 70, 442), footPoint(tSlot).y - 34, `<span class="tick">TOTAL</span><b>−${ev.dano_total}</b>`, 'total', (el, p, x, y) => {
          el.style.left = x + 'px'; el.style.top = (y - 18 * E.cubicOut(p)) + 'px'; el.style.scale = String(lerp(1.5, 1, E.backOut(Math.min(1, p * 3.2)))); el.style.opacity = p < .78 ? 1 : (1 - p) / .22;
        });
      }
      if (ev.lider) {
        floatText(lastImpact + 120, 1300, clamp(center.x, 70, 442), footPoint(tSlot).y - 74, `♛ LÍDER ×${window.ComboLogic.LIDER_BONUS}`, 'tick-amber lead', (el, p, x, y) => {
          el.style.left = x + 'px'; el.style.top = (y - 12 * E.cubicOut(p)) + 'px'; el.style.scale = String(lerp(1.4, 1, E.backOut(Math.min(1, p * 3.2)))); el.style.opacity = p < .78 ? 1 : (1 - p) / .22;
        });
      }
      if (ev.cura_total > 0) teamTween(c, 400, ev.hp_antes, ev.hp_jogador, logic.hpMax);
      ev.inimigos.forEach((e, i) => { if (!e.vivo) at(lastImpact + 300, 1, { begin: () => setDead(i, true) }); });
      at(lastImpact + 200, 1, { begin: () => moveAim(logic.alvo) });
      for (const k in V.ringVal) V.ringVal[k] = ALLY_BASE[k];
      V.chain = [];
      TL.tail = 0;
      return lastImpact + 380 + (P.showTotal ? 500 : 0);
    },
    turno_inimigo(ev, c) {
      at(c, 1, { begin() { ev.contadores.forEach((x, i) => setTurn(i, x.contador, x.vivo)); } });
      return c + 60;
    },
    ataque_inimigo(ev, c, logic) {
      const slot = ENEMY_SLOTS[ev.inimigo]; const sp = spriteEl(slot);
      at(c, P.enemyAtkMs, { update(p) { const k = p < .35 ? E.quadOut(p / .35) : 1 - E.quadIn((p - .35) / .65); sp.style.transform = `translateX(${-P.enemyLungePx * k}px)`; }, end() { sp.style.transform = ''; } });
      const hit = c + P.enemyAtkMs * .35;
      const visor = part('visor'); shakeEl(visor, hit, 180, 3);
      const hpBefore = ev.hp_jogador + ev.dano;
      teamTween(hit, 380, hpBefore, ev.hp_jogador, logic.hpMax);
      const bar = part('team_hp_bar');
      at(hit, 260, { update(p) { bar.style.boxShadow = `0 0 ${14 * (1 - p)}px rgba(255,107,74,${1 - p})`; }, end() { bar.style.boxShadow = ''; } });
      const tb = rel(part('team_hp_text'));
      floatText(hit, P.numLifeMs, tb.x + tb.w / 2, tb.y - 6, `−${ev.dano}`, 'num', (el, p, x, y) => numAnim(el, p, x, y, 1, '#FF6B4A', false, 0, P.numRise * .7));
      return c + P.enemyAtkMs + 120;
    },
    fim(ev, c) {
      playEnd(ev.resultado, c + P.endDelayMs);
      return c + P.endDelayMs;
    },
    lider(ev, c) {
      const b = rel(leaderBtn), from = { x: b.x + b.w / 2, y: b.y + b.h / 2 };
      at(c, 1, { begin() { setLeader(ev.ativo, 0); V.leaderOn = ev.ativo; V.leaderFrom = c; } });
      at(c, 320, { update(p) { leaderBtn.style.scale = String(1 + .35 * Math.sin(p * Math.PI) * (1 - p * .3)); }, end() { leaderBtn.style.scale = ''; } });
      if (!ev.ativo) {
        floatText(c, 700, 256, from.y - 18, 'LIDERANÇA CANCELADA', 'tick-amber', (el, p, x, y) => { el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.opacity = p < .7 ? 1 : (1 - p) / .3; });
        return c + 120;
      }
      sfx('se_arrart2', c);
      flash(c, from.x, from.y); shock(c, from.x, from.y, '#FFD36A');
      burst(c, from.x, from.y, '#FFD36A', 34, 60, 260, 520, 2.4, 60);
      ALLY_SLOTS.forEach((slot, i) => {
        const to = figPoint(slot, .62);
        for (let k = 0; k < P.leaderOrbs; k++) orb(c + 80 + i * 45 + k * 60, P.leaderMs * .8, from, to, '#FFD36A', P.arcPx * .8, P.orbSize * .9, P.trail);
        const arrive = c + 80 + i * 45 + P.leaderMs * .8;
        burst(arrive, to.x, to.y, '#FFD36A', 10, 30, 130, 380, 2, -40);
        hop(slot, arrive, P.hopPx * 1.2);
      });
      floatText(c + 60, P.leaderMs + 900, 256, from.y - 22, `♛ LIDERANÇA · +${Math.round((ev.bonus - 1) * 100)}% NESTA CORRENTE`, 'tick-amber lead', (el, p, x, y) => {
        el.style.left = x + 'px'; el.style.top = (y - 8 * E.cubicOut(p)) + 'px'; el.style.scale = String(lerp(1.5, 1, E.backOut(Math.min(1, p * 4)))); el.style.opacity = p < .8 ? 1 : (1 - p) / .2;
      });
      return c + P.leaderMs;
    },
    lider_recarga(ev, c) {
      shakeEl(leaderBtn, c, 260, 3);
      floatText(c, 800, 256, rel(leaderBtn).y - 18, `LIDERANÇA RECARREGA · ${ev.cd} ${ev.cd > 1 ? 'CORRENTES' : 'CORRENTE'}`, 'tick-red', (el, p, x, y) => { el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.opacity = p < .7 ? 1 : (1 - p) / .3; });
      return c + 60;
    },
    lider_estado(ev, c) {
      at(Math.max(c, TL.tail), 1, { begin() { setLeader(ev.ativo, ev.cd); V.leaderOn = ev.ativo; } });
      return c;
    },
  };
  function figWidth(slot) { return rel(figEl(slot)).w; }
  function numAnim(el, p, x, y, dir, col, crit, drift = 0, rise = P.numRise, origin = null) {
    const popT = Math.min(1, p / .18);
    const s = p < .18 ? lerp(.35, P.numPop, E.cubicOut(popT)) : lerp(P.numPop, 1, E.cubicOut(Math.min(1, (p - .18) / .2)));
    // salto: sai do centro do inimigo, faz um arco ate o ponto sorteado e depois sobe
    const j = origin ? clamp(p / Math.max(.01, P.numJump), 0, 1) : 1;
    const bx = origin ? lerp(origin.x, x, E.quadOut(j)) : x;
    const by = origin ? lerp(origin.y, y, E.quadOut(j)) - Math.sin(j * Math.PI) * P.numHop : y;
    const rp = origin ? clamp((p - P.numJump) / Math.max(.01, 1 - P.numJump), 0, 1) : p;
    el.style.left = (bx + drift * E.quadOut(rp)) + 'px';
    el.style.top = (by - rise * E.cubicOut(rp)) + 'px';
    el.style.scale = String(s * (crit ? P.critScale : 1));
    el.style.opacity = p < .65 ? 1 : (1 - p) / .35;
    el.style.color = col; el.style.fontSize = P.numSize + 'px';
  }

  // ------------------------------------------------------------------ jogo
  let logic;
  let chainStart = null;
  function snapshotFull(l) {
    return JSON.stringify({ l: l.snapshot(), alvo: l.alvo, bag: { cartas: l.bag.cartas, pos: l.bag.pos } });
  }
  function restoreFull(json) {
    const s = JSON.parse(json);
    const l = new Logic({ seed: 1 });
    Object.assign(l, s.l); l.alvo = s.alvo; l.bag.cartas = s.bag.cartas; l.bag.pos = s.bag.pos; l.snapshots = [];
    return l;
  }
  let lastPreset = null;
  function newGame(preset) {
    lastPreset = preset;
    V.stats = newStats();
    const p = preset && PRESETS[preset];
    logic = p ? new Logic({ seed: 42, mao: p.mao, fila: p.fila }) : new Logic({});
    TL.cursor = TL.t; TL.busyUntil = 0; TL.tail = 0;
    chainStart = null;
    rebuild(logic);
    hud.hint.textContent = p ? `Toques sugeridos (casas): ${p.toques.join(', ')} — casas 10 e 11 são as de entrada.` : 'Mão aleatória da BAG.';
    play({ tipo: 'jogada', eventos: [], n_combos: 0 }, logic);
  }
  function onCardTap(el) {
    if (TL.t < TL.busyUntil || END.active) return;
    const markedSlot = Object.keys(V.marked).find((k) => V.marked[k] === el);
    if (!logic.zona.length) chainStart = { json: snapshotFull(logic), taps: [] };
    let r;
    if (markedSlot != null) { r = logic.desmarcar(+markedSlot); chainStart && chainStart.taps.push(['desmarcar', +markedSlot]); }
    else {
      const slot = V.hand.indexOf(el); if (slot < 0) return;
      r = logic.tocar(slot); chainStart && chainStart.taps.push(['tocar', slot]);
    }
    play(r, logic);
    if (r.n_combos > 0) hud.replay.disabled = false;
  }
  function tapSlot(slot) { const el = V.marked[slot] || V.hand[slot]; if (el) onCardTap(el); }
  function replay() {
    if (!chainStart) return;
    const saved = chainStart;
    logic = restoreFull(saved.json); rebuild(logic); TL.cursor = TL.t; TL.busyUntil = 0; TL.tail = 0;
    let delay = 0;
    saved.taps.forEach(([fn, slot]) => { setTimeout(() => { const r = logic[fn](slot); play(r, logic); }, delay); delay += 380 / TL.speed; });
    chainStart = saved;
  }

  if (leaderBtn) leaderBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (TL.t < TL.busyUntil || END.active) return;
    play(logic.alternarLider(), logic);
  });

  // alvo: toque no inimigo
  ROOT.querySelectorAll('[data-part="visor"] > button[data-loop="enemies"]').forEach((b) => {
    b.addEventListener('pointerdown', () => { const i = +b.getAttribute('data-i'); if (!logic.inimigos[i].vivo) return; logic.alvo = i; moveAim(i); });
  });

  // ------------------------------------------------------------------ painel
  const hud = {};
  function buildPanel() {
    const pan = document.getElementById('lab-panel');
    pan.innerHTML = `
      <div class="pn-title">Laboratório de combo <span class="tick">ILHA DIGITAL · TERMINAL</span></div>
      <div class="pn-row"><span class="tick">TEMPO</span><b id="lab-clock" class="mono">0.00s</b></div>
      <div class="pn-btns">
        <button id="b-pause">Pausar</button><button id="b-step">+1 quadro</button>
        <label class="spd">velocidade <input id="b-speed" type="range" min="0.05" max="2" step="0.05" value="1"><span id="b-speed-v" class="mono">1.00×</span></label>
      </div>
      <div class="pn-sec">Mão de teste</div>
      <div class="pn-btns">
        <select id="b-preset">${Object.entries(PRESETS).map(([k, v]) => `<option value="${k}">${v.nome}</option>`).join('')}</select>
        <button id="b-apply">Aplicar</button><button id="b-auto">Aplicar e jogar</button>
      </div>
      <div class="pn-btns"><button id="b-random">Mão aleatória (BAG)</button><button id="b-undo">Desfazer</button><button id="b-replay" disabled>Repetir última corrente</button></div>
      <div class="pn-btns"><button id="b-win">Testar vitória</button><button id="b-lose">Testar derrota</button><button id="b-lead">Ativar líder</button></div>
      <div id="lab-hint" class="pn-hint"></div>
      <div id="lab-state" class="pn-hint mono"></div>
      <div class="pn-sec">Tom das cartas <span class="tick">prévia · filtro sobre a arte atual</span></div>
      <div id="lab-tone"></div>
      <div class="pn-sec">Parâmetros <span class="tick">salvos neste navegador</span></div>
      <div id="lab-params"></div>
      <div class="pn-btns"><button id="b-reset">Restaurar padrão</button><button id="b-export">Exportar JSON</button><button id="b-copy">Copiar</button></div>
      <textarea id="lab-json" class="mono" rows="6" readonly></textarea>
      <div class="pn-sec">Eventos da lógica</div>
      <pre id="lab-log" class="mono"></pre>`;
    hud.clock = pan.querySelector('#lab-clock'); hud.log = pan.querySelector('#lab-log'); hud.hint = pan.querySelector('#lab-hint');
    hud.state = pan.querySelector('#lab-state'); hud.undo = pan.querySelector('#b-undo'); hud.replay = pan.querySelector('#b-replay');
    const params = pan.querySelector('#lab-params');
    SCHEMA.forEach(([g, rows], gi2) => {
      const d = document.createElement('details'); if (gi2 === 1 || gi2 === 5) d.open = true;
      d.innerHTML = `<summary>${g}</summary>`;
      rows.forEach(([k, label, mn, mx, st]) => {
        const row = document.createElement('label'); row.className = 'pr';
        row.innerHTML = `<span>${label}</span><input type="range" min="${mn}" max="${mx}" step="${st}" value="${P[k]}"><b class="mono">${P[k]}</b>`;
        const inp = row.querySelector('input'), out = row.querySelector('b');
        inp.addEventListener('input', () => { P[k] = +inp.value; out.textContent = inp.value; saveP(); });
        row._sync = () => { inp.value = P[k]; out.textContent = P[k]; };
        d.appendChild(row);
      });
      params.appendChild(d);
    });
    const $ = (id) => pan.querySelector(id);
    $('#b-pause').onclick = () => { TL.paused = !TL.paused; $('#b-pause').textContent = TL.paused ? 'Continuar' : 'Pausar'; };
    $('#b-step').onclick = () => { TL.paused = true; $('#b-pause').textContent = 'Continuar'; TL.t += 1000 / 60; tick(TL.t); };
    $('#b-speed').oninput = (e) => { TL.speed = +e.target.value; $('#b-speed-v').textContent = TL.speed.toFixed(2) + '×'; };
    $('#b-apply').onclick = () => newGame($('#b-preset').value);
    $('#b-auto').onclick = () => { const k = $('#b-preset').value; newGame(k); PRESETS[k].toques.forEach((s, i) => setTimeout(() => tapSlot(s), 350 + i * 380 / TL.speed)); };
    $('#b-random').onclick = () => newGame(null);
    $('#b-undo').onclick = () => { if (TL.t < TL.busyUntil) return; if (logic.desfazer()) { rebuild(logic); play({ tipo: 'jogada', eventos: [], n_combos: 0 }, logic); } };
    $('#b-replay').onclick = replay;
    $('#b-win').onclick = () => { playEnd('vitoria', TL.t); };
    $('#b-lose').onclick = () => { playEnd('derrota', TL.t); };
    $('#b-lead').onclick = () => { if (TL.t >= TL.busyUntil && !END.active) play(logic.alternarLider(), logic); };
    $('#b-reset').onclick = () => { P = { ...DEFAULTS }; saveP(); params.querySelectorAll('.pr').forEach((r) => r._sync()); };
    const exportJson = () => JSON.stringify({ animacao: P, tom_cartas: toneChanged() }, null, 1);
    $('#b-export').onclick = () => { $('#lab-json').value = exportJson(); };
    $('#b-copy').onclick = async () => { $('#lab-json').value = exportJson(); try { await navigator.clipboard.writeText($('#lab-json').value); $('#b-copy').textContent = 'Copiado'; } catch (e) { $('#lab-json').select(); } setTimeout(() => { $('#b-copy').textContent = 'Copiar'; }, 1200); };
  }

  // ------------------------------------------------------------------ tom das cartas
  // Filtro CSS sobre a arte (matiz / saturacao / brilho). Serve para achar o tom; o valor final
  // e aplicado de verdade no gerador (cards/build_cards.py, tabela PAL) e as PNGs sao reexportadas.
  const TONE_KEY = 'ilhaDigital.comboLab.tone.v1';
  const TONE = {}; ELEM.forEach((e) => { TONE[e] = { h: 0, s: 1, b: 1 }; });
  try { const t = JSON.parse(localStorage.getItem(TONE_KEY) || '{}'); for (const e in t) if (TONE[e]) Object.assign(TONE[e], t[e]); } catch (e) { /* sem storage */ }
  const toneStyle = document.createElement('style'); document.head.appendChild(toneStyle);
  function applyTone() {
    toneStyle.textContent = ELEM.map((e) => { const t = TONE[e];
      return `[data-el="${e}"] img { filter: hue-rotate(${t.h}deg) saturate(${t.s}) brightness(${t.b}); }`; }).join('\n');
    try { localStorage.setItem(TONE_KEY, JSON.stringify(TONE)); } catch (e) { /* ignore */ }
  }
  function toneChanged() { const o = {}; for (const e in TONE) { const t = TONE[e]; if (t.h || t.s !== 1 || t.b !== 1) o[e] = { ...t }; } return o; }
  function buildTone() {
    const box = document.getElementById('lab-tone'); let cur = 'light';
    box.innerHTML = `<div class="tone-row">${ELEM.map((e) => `<button class="tone-card" data-el="${e}" data-pick="${e}" title="${e}"><img src="${IMG[e]}"><span class="tick">${e}</span></button>`).join('')}</div>
      <div class="tone-ctl"></div>`;
    const ctl = box.querySelector('.tone-ctl');
    const rows = [['h', 'Matiz (graus)', -60, 60, 1], ['s', 'Saturação', 0.3, 1.8, 0.02], ['b', 'Brilho', 0.5, 1.6, 0.02]];
    function draw() {
      box.querySelectorAll('.tone-card').forEach((b) => b.classList.toggle('on', b.dataset.pick === cur));
      ctl.innerHTML = rows.map(([k, l, mn, mx, st]) => `<label class="pr"><span>${cur} · ${l}</span><input type="range" min="${mn}" max="${mx}" step="${st}" value="${TONE[cur][k]}" data-k="${k}"><b class="mono">${TONE[cur][k]}</b></label>`).join('')
        + `<div class="pn-btns"><button data-reset>Zerar ${cur}</button></div>`;
      ctl.querySelectorAll('input').forEach((i) => i.addEventListener('input', () => { TONE[cur][i.dataset.k] = +i.value; i.nextElementSibling.textContent = i.value; applyTone(); }));
      ctl.querySelector('[data-reset]').onclick = () => { TONE[cur] = { h: 0, s: 1, b: 1 }; applyTone(); draw(); };
    }
    box.querySelectorAll('.tone-card').forEach((b) => { b.onclick = () => { cur = b.dataset.pick; draw(); }; });
    draw(); applyTone();
  }

  // ------------------------------------------------------------------ escala da tela
  function fit() {
    const wrap = document.getElementById('lab-wrap');
    const avail = Math.max(320, window.innerHeight - 24);
    K = Math.min(1.35, avail / 800);
    if (window.innerWidth < 900) K = Math.min(K, (window.innerWidth - 16) / 512);
    if (SNAP) K = window.innerWidth / 512;
    STAGE.style.transform = `scale(${K})`;
    wrap.style.width = 512 * K + 'px'; wrap.style.height = 800 * K + 'px';
    sizeCanvas();
    if (TL.paused && hud.clock) tick(TL.t); // redimensionar o canvas limpa o desenho
  }

  // ------------------------------------------------------------------ inicio
  const hash = new URLSearchParams(location.hash.slice(1));
  const SNAP = hash.get('snap') != null;
  buildPanel();
  buildTone();
  fit(); window.addEventListener('resize', fit);
  if (hash.get('snap') != null) {
    // modo captura: joga a mao de teste em tempo simulado e congela no instante pedido
    const preset = hash.get('demo') || 'vermelho_roxo'; const T = +hash.get('snap');
    Object.keys(DEFAULTS).forEach((k) => { if (hash.get(k) != null) P[k] = +hash.get(k); });
    TL.paused = true; newGame(preset);
    if (hash.get('lead') != null) { TL.t = 100; tick(TL.t); play(logic.alternarLider(), logic); }
    if (hash.get('end')) { TL.t = 150; tick(TL.t); playEnd(hash.get('end'), 150); }
    const gap = +(hash.get('gap') || 380);
    const taps = PRESETS[preset].toques.map((s, i) => ({ t: 200 + i * gap, s }));
    for (const tp of taps) { if (tp.t > T) break; TL.t = tp.t; tick(TL.t); TL.busyUntil = 0; tapSlot(tp.s); TL.busyUntil = 0; }
    TL.t = T; tick(T);
    document.body.dataset.canvas = String(canvas.toDataURL().length);
    document.body.classList.add('snap');
  } else {
    newGame('vermelho_roxo');
    requestAnimationFrame((n) => { last = n; loop(n); });
  }
  window.LAB = { TL, P, get logic() { return logic; }, tick, newGame, tapSlot };
}
(function () {
  const go = () => { if (!window.__labBooted) { window.__labBooted = true; bootLab(); } };
  Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise((r) => setTimeout(r, 1200))]).then(go, go);
})();
</script>

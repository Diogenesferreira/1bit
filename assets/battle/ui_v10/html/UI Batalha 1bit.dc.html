const STAGE_W = 888;
const FORMS = {
  1: {scale:6, sprite:330, note:'Boss unico — placa 192x72 (6x)',
      list:[{cx:444, y:34, el:'dragon', hp:.92, turn:1}]},
  2: {scale:6, sprite:236, note:'Dupla — placa 192x72 (6x)',
      list:[{cx:256, y:44, el:'nature', hp:.74, turn:2},
            {cx:632, y:44, el:'dark',   hp:.55, turn:1}]},
  3: {scale:4, sprite:190, note:'Trio escalonado — placa 128x48 (4x)',
      list:[{cx:154, y:26, el:'nature', hp:.45, turn:2},
            {cx:444, y:214, el:'dark',  hp:.73, turn:3},
            {cx:734, y:26, el:'knight', hp:.93, turn:1}]},
  5: {scale:4, sprite:150, note:'Fase especial — 3 atras + 2 na frente (placa 4x)',
      list:[{cx:124, y:18, el:'nature', hp:.62, turn:2},
            {cx:444, y:18, el:'dark',   hp:.88, turn:1},
            {cx:764, y:18, el:'light',  hp:.40, turn:3},
            {cx:278, y:272, el:'knight',hp:.71, turn:2},
            {cx:610, y:272, el:'dragon',hp:.96, turn:1}]}
};
class Component extends DCLogic {
  state = {formation: 3};
  renderVals(){
    const n = this.state.formation;
    const f = FORMS[n] || FORMS[3];
    const k = f.scale, pw = 32*k, ph = 12*k, dw = 3.5*k, dh = 4*k;
    const enemies = f.list.map((e,i)=>({
      key: n+'-'+i,
      slotId: 'ui1b-en'+n+'-'+i,
      plate: 'assets/enemy_turn_plate_'+e.el+'_v1.png',
      left: Math.round(Math.min(Math.max(e.cx - pw/2, 8), STAGE_W - pw - 8)),
      top: e.y, pw, ph, sprite: f.sprite,
      dw, dh, digitL: Math.round(11.5*k), digitT: k, sheetW: dw*10,
      digitX: dw*e.turn, labelL: Math.round(15.5*k), labelW: 12*k,
      fillW: Math.round(pw*e.hp)
    }));
    const formations = [1,2,3,5].map(v=>({
      key: v, label: v===1 ? 'Boss' : v+' inimigos',
      bg: v===n ? '#7d9455' : 'transparent',
      fg: v===n ? '#0d0e0c' : '#8f886f',
      border: v===n ? '#7d9455' : 'rgba(201,192,168,.35)',
      select: () => this.setState({formation: v})
    }));
    return {enemies, formations, f_note: f.note};
  }
}
</script>
</body>
</html>
